<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 Math Arcade - Prompt Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Arcade Theme -->
    <link rel="stylesheet" href="css/arcade-theme.css">
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Animated background stars -->
    <div class="stars" id="stars"></div>

    <!-- Floating power-ups -->
    <div class="powerup" style="top: 10%; left: 5%;">⭐</div>
    <div class="powerup" style="top: 20%; right: 10%; animation-delay: 1s;">🏆</div>
    <div class="powerup" style="top: 60%; left: 15%; animation-delay: 2s;">💎</div>
    <div class="powerup" style="bottom: 15%; right: 20%; animation-delay: 1.5s;">🎯</div>

    <!-- Coin counter -->
    <div class="coin-counter">
        <div class="coin">🪙</div>
        <div style="margin-top: 8px;">PROMPTS: <span id="credits">0</span></div>
    </div>

    <header class="bg-blue-600 text-white shadow-md arcade-header">
        <nav class="container mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <h1 class="text-2xl font-bold">🎮 PROMPT BUILDER 🎮</h1>
                <div class="space-x-4">
                    <a href="index.html" class="hover:text-blue-200">🏠 HOME</a>
                    <a href="prompt-builder.html" class="hover:text-blue-200">🔧 BUILDER</a>
                </div>
            </div>
        </nav>
    </header>

    <main class="container mx-auto px-6 py-8">
        <div class="max-w-4xl mx-auto">
            <div class="bg-white rounded-lg shadow-md p-8 arcade-card">
                <h2 class="text-3xl font-bold arcade-title mb-2">CORBETT MATHS WORKSHEET BUILDER</h2>
                <p class="arcade-text mb-6">Generate a prompt for creating math worksheet JSONs from Corbett Maths PDFs</p>
                
                <form id="promptForm" class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Topic</label>
                        <select id="topic" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                            <option value="Fractions">Fractions</option>
                            <option value="Linear Equations">Linear Equations</option>
                            <option value="Simultaneous Equations">Simultaneous Equations</option>
                            <option value="Quadratics">Quadratics</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Difficulty</label>
                        <select id="difficulty" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                            <option value="easy">Easy</option>
                            <option value="medium">Medium</option>
                            <option value="difficult">Difficult</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Grade</label>
                        <select id="grade" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                            <option value="KS3">KS3</option>
                            <option value="KS4 Foundation">KS4 Foundation</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Questions PDF URL</label>
                        <input type="url" id="questionsUrl" placeholder="https://corbettmaths.com/wp-content/uploads/..." 
                               class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                               required>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Answers PDF URL</label>
                        <input type="url" id="answersUrl" placeholder="https://corbettmaths.com/wp-content/uploads/..." 
                               class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                               required>
                    </div>

                    <button type="submit" class="w-full bg-blue-600 text-white py-3 px-6 rounded-md hover:bg-blue-700 transition-colors font-medium">
                        Generate Prompt
                    </button>
                </form>

                <div id="output" class="mt-8 hidden">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="text-xl font-semibold text-gray-800">Generated Prompt</h3>
                        <button id="copyBtn" class="bg-green-600 text-white py-2 px-4 rounded-md hover:bg-green-700 transition-colors text-sm">
                            Copy to Clipboard
                        </button>
                    </div>
                    <div class="bg-gray-50 border border-gray-300 rounded-md p-6">
                        <pre id="promptOutput" class="whitespace-pre-wrap text-sm text-gray-800 font-mono"></pre>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/prompt-builder.js"></script>
    <script>
        // Create animated stars
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 50; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.width = Math.random() * 3 + 'px';
            star.style.height = star.style.width;
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 3 + 's';
            starsContainer.appendChild(star);
        }

        // Sound effect
        function playSound() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);

                oscillator.frequency.value = 800;
                oscillator.type = 'square';

                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);

                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.1);
            } catch (e) {
                console.log('Audio not available');
            }
        }

        // Add sound to buttons and track prompts
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', playSound);
            });

            // Track generated prompts
            const form = document.getElementById('promptForm');
            let promptCount = 0;
            if (form) {
                form.addEventListener('submit', () => {
                    promptCount++;
                    document.getElementById('credits').textContent = promptCount;
                });
            }
        });
    </script>
</body>
</html>
